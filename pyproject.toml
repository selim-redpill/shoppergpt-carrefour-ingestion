[tool.poetry]
name = "shopper-gpt-carrefour-ingest"
version = "0.1.0"
description = "Carrefour Traiteur ETL ingestion pipeline"
authors = ["Redpill"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pymongo = "^4.17.0"
python-dotenv = "^1.2.2"
tqdm = "^4.67.3"
structlog = "^25.5.0"
openai = "^1.0.0"
pinecone = "^6.0.0"
# categorize.py talks to Gemini over plain urllib; from Google's SDKs it needs
# only the ADC token helper (`google.auth.transport.requests`), whose transport
# lives behind the "requests" extra — declared explicitly, because it used to
# arrive by chance through the two unused google-genai packages removed here.
google-auth = {version = "^2.38.0", extras = ["requests"]}

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.15"
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
# `package-mode = false` means `ingest` is never installed into the venv, and
# `poetry run pytest` runs the console script, which does not put the repo root
# on sys.path (unlike `python -m pytest`, which adds the cwd). Without this the
# suite only collects when invoked the second way.
pythonpath = ["."]
testpaths = ["tests"]
